name: Deploy

# Continuous deployment to the production VPS (see docs/deploy.md): when CI passes on main, SSH into the server with a
# key that can only run deploy/deploy.sh, passing the tested commit. The server pulls that commit, rebuilds the stack
# and rolls back by itself if the new version is not healthy.
# Manual run: Actions → Deploy → Run workflow (deploys the tip of main).
#
# Repository secrets: VPS_HOST (server IP), VPS_SSH_KEY (private deploy key), VPS_KNOWN_HOSTS (`ssh-keyscan <ip>`).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://techrat.io
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SHA: ${{ github.event.workflow_run.head_sha || '' }}
        # The server ignores the remote command except for this sha (forced command); empty means the tip of main.
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "root@$VPS_HOST" "$SHA"
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://techrat.io/
