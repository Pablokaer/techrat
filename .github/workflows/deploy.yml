name: Deploy

# Continuous deployment to the production VPS (see docs/deploy.md): when CI passes on main, SSH into the server with a
# key that can only run deploy/deploy.sh, passing the tested commit (deploy/remote-deploy.sh). The server pulls that
# commit, rebuilds the stack and rolls back by itself if the new version is not healthy. Some runners never reached the
# SSH port while the site stayed up; when that happens the second job tries again from a fresh runner.
# Manual run: Actions → Deploy → Run workflow (deploys the tip of main).
#
# Repository secrets: VPS_HOST (server IP), VPS_SSH_KEY (private deploy key), VPS_KNOWN_HOSTS (`ssh-keyscan <ip>`).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://techrat.io
    outputs:
      unreachable: ${{ steps.deploy.outputs.unreachable }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: deploy }
      - name: Deploy
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          # The server ignores the remote command except for this sha (forced command); empty means the tip of main.
          SHA: ${{ github.event.workflow_run.head_sha || '' }}
        # Exit 75: the server's SSH port never answered this runner, so the next job deploys from another one. Any other
        # failure (key refused, deploy.sh rolled back) is final.
        run: |
          code=0
          bash deploy/remote-deploy.sh "$SHA" || code=$?
          if [ "$code" -eq 75 ]; then
            echo "unreachable=true" >> "$GITHUB_OUTPUT"
            echo "::warning::The server did not answer this runner; deploying from another runner."
            exit 0
          fi
          exit "$code"
      - name: Smoke test
        if: steps.deploy.outputs.unreachable != 'true'
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://techrat.io/

  deploy-from-another-runner:
    name: Deploy to production (another runner)
    needs: deploy
    if: needs.deploy.outputs.unreachable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://techrat.io
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: deploy }
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: bash deploy/remote-deploy.sh "$SHA"
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://techrat.io/
