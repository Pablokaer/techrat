name: Android release

# Starts an EAS build of the Android app bundle that EAS submits to Google Play as a DRAFT release (ADR-0047, docs/android-release.md).
# Start it by pushing a tag android-v<version> on a commit of main, where <version> is expo.version in
# apps/mobile/app.json (for example android-v1.0.1), or by hand from the Actions tab on main. The release job waits for
# an approval in the google-play environment, and the draft still has to be rolled out in the Play Console.
#
# Needs: the EXPO_TOKEN secret in the google-play environment, and the Google service-account key uploaded to the Expo
# account (`eas credentials`). The very first upload of the app to Play must be done by hand.

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track that receives the draft release"
        type: choice
        options: [internal, closed]
        default: internal

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (tag, version, mobile checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      profile: ${{ steps.version.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: The commit is on main and the tag matches app.json
        id: version
        env:
          TRACK: ${{ inputs.track || 'internal' }}
        run: |
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main: release only what production already runs"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "android-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match expo.version $version in apps/mobile/app.json"; exit 1
          fi
          if [ "$TRACK" = "closed" ]; then profile=closed; else profile=production; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Mobile typecheck and tests
        run: npm run typecheck -w @techrat/mobile && npm test -w @techrat/mobile
      - name: The production Expo config resolves
        run: npm run check:production-config -w @techrat/mobile

  release:
    name: Build on EAS and submit to Google Play (draft)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: google-play
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build the app bundle on EAS and have EAS submit it to Play as a draft
        working-directory: apps/mobile
        env:
          PROFILE: ${{ needs.verify.outputs.profile }}
          VERSION: ${{ needs.verify.outputs.version }}
        # --no-wait: the build (15-25 minutes, plus the EAS queue) and the submission run on EAS, not on this runner;
        # EAS emails the account if either fails. versionCode is incremented by EAS.
        run: |
          eas build --platform android --profile production --auto-submit-with-profile "$PROFILE" \
            --non-interactive --no-wait --json > "$RUNNER_TEMP/build.json"
          id=$(jq -r '.[0].id' "$RUNNER_TEMP/build.json")
          test -n "$id" && [ "$id" != "null" ] || { echo "::error::EAS returned no build id"; exit 1; }
          {
            echo "TechRat $VERSION: EAS build $id, submitted with the '$PROFILE' submit profile when it finishes."
            echo ""
            echo "Follow it at https://expo.dev/accounts/climboulths-team/projects/pablo-carvalho/builds/$id,"
            echo "then roll the draft out in the Play Console."
          } >> "$GITHUB_STEP_SUMMARY"
