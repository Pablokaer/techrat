[package]
name = "techrat-desktop"
version = "0.1.0"
description = "TechRat desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "techrat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The OS credential store (Windows Credential Manager, macOS Keychain, Secret Service on Linux): the bearer tokens live there.
# Version 3 has no default backend, so each platform's is named; crypto-rust and vendored keep the Linux build free of
# OpenSSL and of a system libdbus.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
