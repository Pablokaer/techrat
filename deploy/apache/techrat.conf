# Apache virtual host for TechRat behind docker-compose.prod.yml (see docs/deploy.md).
# Install: copy to /etc/apache2/sites-available/techrat.conf, replace techrat.io with your domain,
#          a2enmod proxy proxy_http headers rewrite && a2ensite techrat && apache2ctl configtest && systemctl reload apache2
# HTTPS:   certbot --apache -d techrat.io -d www.techrat.io --redirect   (creates the :443 copy of this vhost)
<VirtualHost *:80>
    ServerName techrat.io
    ServerAlias www.techrat.io

    # One canonical host (cookies and password-reset links use it).
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ %{REQUEST_SCHEME}://techrat.io%{REQUEST_URI} [R=301,L]

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # SignalR (realtime notifications) goes straight to the API, with websocket upgrade.
    ProxyPass        /hubs/ http://127.0.0.1:5080/hubs/ upgrade=websocket
    ProxyPassReverse /hubs/ http://127.0.0.1:5080/hubs/

    # Everything else: the Next.js app (it proxies /api to the API inside the Docker network).
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/techrat-error.log
    CustomLog ${APACHE_LOG_DIR}/techrat-access.log combined
</VirtualHost>
